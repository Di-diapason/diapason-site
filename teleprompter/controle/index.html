<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0F3633">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Controle">
<title>Controle do prompter · Diapason</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/teleprompter/icones/icone-180.png">
<style>
@font-face{font-family:'Montserrat';font-weight:400 800;font-display:swap;src:url(/fonts/montserrat-normal-400-800-latin.woff2) format('woff2')}
@font-face{font-family:'Lato';font-weight:400;font-display:swap;src:url(/fonts/lato-normal-400-latin.woff2) format('woff2')}
:root{--fundo:#0F3633;--cartao:#16443f;--cartao2:#1c514b;--texto:#F2F0E6;--suave:rgba(242,240,230,.66);--linha:rgba(242,240,230,.16);--acento:#E25A26;--ok:#7fd0a3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fundo)}
body{color:var(--texto);font:400 17px/1.45 Lato,system-ui,sans-serif;min-height:100vh;min-height:100dvh;padding:calc(12px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:520px;margin:0 auto;flex:1;display:flex;flex-direction:column}
h1{font:800 20px/1.2 Montserrat,system-ui,sans-serif;margin:0;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
p{margin:0 0 16px;color:var(--suave)}
svg{display:block;flex:none}
.ic{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#entrar{margin-top:18vh}
#entrar .marca{width:56px;height:56px;border-radius:14px;margin-bottom:18px}
form{display:flex;gap:8px}
input{flex:1;min-width:0;font:800 28px/1 Montserrat,system-ui,sans-serif;letter-spacing:.25em;text-transform:uppercase;padding:14px;border:1px solid var(--linha);border-radius:14px;background:var(--cartao);color:inherit;text-align:center}
button{font:inherit;color:inherit;border:0;background:var(--cartao);border-radius:18px;cursor:pointer;transition:transform .08s,background .15s}
button:active{transform:scale(.96);background:var(--cartao2)}
form button{padding:0 20px;font-weight:700;background:var(--texto);color:var(--fundo)}
.topo{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.chip{flex:none;font:800 13px/1 Montserrat,system-ui,sans-serif;letter-spacing:.14em;padding:7px 10px;border-radius:999px;background:var(--cartao);color:var(--suave)}
.status{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;color:var(--suave);margin:0 0 8px}
.status span{display:flex;align-items:center;gap:8px}
.status span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--suave);opacity:.5}
body.ligado .status span::before{background:var(--ok);opacity:1}
.status b{font:800 16px/1 Montserrat,system-ui,sans-serif;color:var(--texto);font-variant-numeric:tabular-nums}
.barra{height:4px;border-radius:2px;background:var(--linha);overflow:hidden;margin-bottom:14px}
.barra i{display:block;height:100%;width:0;background:var(--texto);transition:width .4s}
.modos{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;background:var(--cartao);margin-bottom:14px}
.modos button{min-height:42px;font-size:15px;background:transparent;border-radius:11px;color:var(--suave);display:flex;align-items:center;justify-content:center;gap:8px}
.modos button .ic{width:20px;height:20px}
.modos button[aria-pressed="true"]{background:var(--texto);color:var(--fundo);font-weight:700}
.grade{flex:1;display:flex;flex-direction:column;gap:12px}
.principal{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:8px 0}
.redondo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:96px;font-size:14px;color:var(--suave)}
.redondo .ic{width:34px;height:34px;color:var(--texto)}
.play{width:min(42vw,168px);height:min(42vw,168px);border-radius:50%;background:var(--acento);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.play:active{background:#c94d1f}
.play .ic{width:56px;height:56px;fill:currentColor;stroke:none}
.play .rot{font-size:14px;letter-spacing:.04em;opacity:.92}
.play .i-pausa,.play.tocando .i-play{display:none}
.play.tocando .i-pausa{display:block}
.vel{display:grid;grid-template-columns:76px 1fr 76px;align-items:center;gap:10px;padding:10px;border-radius:20px;background:var(--cartao)}
.vel button{height:64px;border-radius:14px;background:var(--cartao2);display:flex;align-items:center;justify-content:center}
.vel button .ic{width:30px;height:30px}
.vel .mostra{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--suave);font-size:13px}
.vel .mostra .ic{width:26px;height:26px}
.vel .mostra b{display:block;font:800 32px/1 Montserrat,system-ui,sans-serif;color:var(--texto);font-variant-numeric:tabular-nums}
.linha{display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;font-size:16px}
.linha .ic{width:24px;height:24px}
.sair{margin-top:12px;background:none;color:var(--suave);font-size:14px;align-self:center;padding:10px;display:flex;align-items:center;gap:6px}
.sair .ic{width:18px;height:18px}
#fader{flex:1;display:flex;flex-direction:column;min-height:0}
.fader-area{flex:1;display:grid;grid-template-columns:1fr 120px 1fr;gap:12px;min-height:300px;max-height:62vh}
.escala{display:flex;flex-direction:column;justify-content:space-between;font-size:14px;color:var(--suave);text-align:right;padding:6px 0}
.escala span:nth-child(2){color:var(--texto)}
.trilho{position:relative;border-radius:18px;background:var(--cartao);touch-action:none;cursor:ns-resize}
.trilho .meio{position:absolute;left:10px;right:10px;top:50%;height:2px;margin-top:-1px;background:var(--texto);opacity:.45}
.trilho .cursor{position:absolute;left:8px;right:8px;height:56px;margin-top:-28px;top:50%;border-radius:14px;background:var(--acento);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.trilho .cursor::after{content:"";position:absolute;left:30%;right:30%;top:50%;height:2px;margin-top:-1px;background:rgba(255,255,255,.85)}
.leitura-fader{display:flex;flex-direction:column;justify-content:center;font-size:15px;color:var(--suave)}
.leitura-fader b{font:800 24px/1.15 Montserrat,system-ui,sans-serif;color:var(--texto)}
.aviso-rede{font-size:13px;color:var(--suave);text-align:center;margin-top:8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="s-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></symbol>
  <symbol id="s-pausa" viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/></symbol>
  <symbol id="s-voltar" viewBox="0 0 24 24"><path d="M6 13l6-6 6 6M6 19l6-6 6 6"/></symbol>
  <symbol id="s-avancar" viewBox="0 0 24 24"><path d="M6 5l6 6 6-6M6 11l6 6 6-6"/></symbol>
  <symbol id="s-inicio" viewBox="0 0 24 24"><path d="M5 4h14M12 20V9M7 13l5-5 5 5"/></symbol>
  <symbol id="s-menos" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="s-mais" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="s-vel" viewBox="0 0 24 24"><path d="M4.5 17a8.5 8.5 0 1 1 15 0"/><path d="M12 14l4-5"/><circle cx="12" cy="14.5" r="1.3"/></symbol>
  <symbol id="s-auto" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h13"/></symbol>
  <symbol id="s-fader" viewBox="0 0 24 24"><path d="M12 3v18"/><rect x="8" y="9" width="8" height="5" rx="1.5"/></symbol>
  <symbol id="s-trocar" viewBox="0 0 24 24"><path d="M16 4l4 4-4 4M20 8H9M8 20l-4-4 4-4M4 16h11"/></symbol>
</svg>
<div class="wrap">
  <section id="entrar">
    <img class="marca" src="/teleprompter/icones/icone-180.png" alt="">
    <h1>Controle do prompter</h1>
    <p style="margin-top:6px">Digite o código que aparece no painel do prompter.</p>
    <form id="form"><input id="codigo" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" aria-label="Código da sala" placeholder="····"><button type="submit">Conectar</button></form>
    <p class="aviso-rede" style="margin-top:14px">O controle pelo celular precisa de internet nos dois aparelhos.</p>
  </section>

  <section id="painel" hidden style="flex:1;display:flex;flex-direction:column">
    <div class="topo"><span class="chip" id="chip">SALA</span><h1 id="titulo">Sala</h1></div>
    <div class="status"><span id="conexao">Conectando…</span><b id="tempo"></b></div>
    <div class="barra"><i id="progresso"></i></div>
    <div class="modos" role="group" aria-label="Modo">
      <button data-modo="auto" aria-pressed="true"><svg class="ic"><use href="#s-auto"/></svg>Automático</button>
      <button data-modo="fader" aria-pressed="false"><svg class="ic"><use href="#s-fader"/></svg>Fader</button>
    </div>
    <div id="fader" hidden>
      <div class="fader-area">
        <div class="escala"><span>mais rápido ↑</span><span>parado</span><span>volta ↓</span></div>
        <div class="trilho" id="trilho" aria-label="Fader de velocidade" role="slider" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0"><div class="meio"></div><div class="cursor" id="cursor"></div></div>
        <div class="leitura-fader"><b id="fader-v">Parado</b><span>Fica onde o dedo deixar. No meio, para.</span></div>
      </div>
    </div>
    <div class="grade" id="auto">
      <div class="principal">
        <button class="redondo" data-cmd="voltar" aria-label="Voltar"><svg class="ic"><use href="#s-voltar"/></svg>Voltar</button>
        <button class="play" id="c-alternar" data-cmd="alternar" aria-label="Play ou pausa"><svg class="ic i-play"><use href="#s-play"/></svg><svg class="ic i-pausa"><use href="#s-pausa"/></svg><span class="rot" id="c-rot">Play</span></button>
        <button class="redondo" data-cmd="avancar" aria-label="Avançar"><svg class="ic"><use href="#s-avancar"/></svg>Avançar</button>
      </div>
      <div class="vel">
        <button data-cmd="menos" aria-label="Mais devagar"><svg class="ic"><use href="#s-menos"/></svg></button>
        <div class="mostra"><svg class="ic"><use href="#s-vel"/></svg><span>Velocidade<b id="vel">20</b></span></div>
        <button data-cmd="mais" aria-label="Mais rápido"><svg class="ic"><use href="#s-mais"/></svg></button>
      </div>
      <button class="linha" data-cmd="inicio"><svg class="ic"><use href="#s-inicio"/></svg>Ir ao início</button>
    </div>
    <button class="sair" id="trocar"><svg class="ic"><use href="#s-trocar"/></svg>Trocar de sala</button>
  </section>
</div>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function pegar(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
  function guardar(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function mmss(s) { s = Math.max(0, Math.round(s || 0)); return ("0" + Math.floor(s / 60)).slice(-2) + ":" + ("0" + (s % 60)).slice(-2); }
  var ws = null, sala = "", espera = 1000, ativo = false, trava = null;

  function limpar(v) { return (v || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4); }
  var q = new URLSearchParams(location.search).get("sala");
  $("codigo").value = limpar(q || pegar("tp.controle.sala"));
  $("codigo").addEventListener("input", function () { this.value = limpar(this.value); });

  function conexao(t) { $("conexao").textContent = t; document.body.classList.toggle("ligado", t === "Prompter conectado"); }
  function conectar() {
    if (!ativo) return;
    ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/teleprompter/sala/" + sala + "?papel=controle");
    ws.onopen = function () { espera = 1000; conexao("Conectado. Procurando o prompter…"); ws.send(JSON.stringify({ tipo: "cmd", cmd: "estado" })); };
    ws.onmessage = function (ev) {
      if (ev.data === "pong") return;
      var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.tipo === "presenca") conexao(m.prompter ? "Prompter conectado" : "Prompter não está na sala");
      if (m.tipo === "estado") {
        conexao("Prompter conectado");
        $("c-rot").textContent = m.contando ? "Contando…" : (m.tocando ? "Pausa" : "Play");
        $("c-alternar").classList.toggle("tocando", !!(m.tocando || m.contando));
        $("vel").textContent = m.vel;
        if (!m.fader && fv !== 0 && !arrastando && m.tocando) { fv = 0; desenharFader(); }
        $("progresso").style.width = Math.round((m.progresso || 0) * 100) + "%";
        $("tempo").textContent = mmss(m.crono);
        if (m.titulo) $("titulo").textContent = m.titulo;
      }
    };
    ws.onclose = function (ev) {
      ws = null; if (!ativo) return;
      conexao(navigator.onLine === false ? "Sem internet: o controle volta quando a rede voltar" : "Sem conexão. Tentando de novo…");
      setTimeout(conectar, espera); espera = Math.min(espera * 2, 10000);
    };
  }
  function entrar(codigo) {
    sala = codigo; guardar("tp.controle.sala", sala); ativo = true;
    $("entrar").hidden = true; $("painel").hidden = false; $("titulo").textContent = "Prompter"; $("chip").textContent = sala;
    conectar(); acordar();
  }
  function acordar() { if ("wakeLock" in navigator && (!trava || trava.released)) navigator.wakeLock.request("screen").then(function (t) { trava = t; }).catch(function () {}); }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && ativo) { acordar(); if (!ws) conectar(); }
  });
  $("form").addEventListener("submit", function (e) { e.preventDefault(); var c = limpar($("codigo").value); if (c.length === 4) entrar(c); });
  document.querySelectorAll("[data-cmd]").forEach(function (b) {
    b.addEventListener("click", function () {
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({ tipo: "cmd", cmd: b.getAttribute("data-cmd") }));
      if (navigator.vibrate) navigator.vibrate(15);
    });
  });
  $("trocar").onclick = function () { ativo = false; if (ws) ws.close(); $("painel").hidden = true; $("entrar").hidden = false; $("codigo").focus(); };
  setInterval(function () { if (ws && ws.readyState === 1) ws.send("ping"); }, 30000);

  /* ---------- fader (pitch de DJ): meio para, acima avança cada vez mais rápido, abaixo volta ---------- */
  var fv = 0, ultimo = 0, pendente = null;
  function enviarFader(forcar) {
    var agora = Date.now();
    if (!forcar && agora - ultimo < 90) { clearTimeout(pendente); pendente = setTimeout(function () { enviarFader(true); }, 90); return; }
    ultimo = agora;
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ tipo: "cmd", cmd: "fader", v: Math.round(fv * 1000) / 1000 }));
  }
  function desenharFader() {
    var t = $("trilho"), c = $("cursor"), h = t.clientHeight, ch = c.offsetHeight;
    c.style.top = (ch / 2 + (1 - fv) / 2 * (h - ch)) + "px";
    t.setAttribute("aria-valuenow", Math.round(fv * 100));
    $("fader-v").textContent = fv === 0 ? "Parado" : (fv > 0 ? "Avança " : "Volta ") + Math.round(Math.abs(fv) * 100) + "%";
  }
  function moverFader(e) {
    var t = $("trilho"), r = t.getBoundingClientRect(), ch = $("cursor").offsetHeight;
    var v = 1 - 2 * (e.clientY - r.top - ch / 2) / (r.height - ch);
    v = Math.max(-1, Math.min(1, v));
    if (Math.abs(v) < 0.08) v = 0; // trinco suave no meio
    if (v !== fv) { var cruzou = (v === 0) !== (fv === 0); fv = v; desenharFader(); enviarFader(); if (cruzou && navigator.vibrate) navigator.vibrate(10); }
  }
  var arrastando = false;
  $("trilho").addEventListener("pointerdown", function (e) { arrastando = true; this.setPointerCapture(e.pointerId); moverFader(e); });
  $("trilho").addEventListener("pointermove", function (e) { if (arrastando) moverFader(e); });
  $("trilho").addEventListener("pointerup", function () { arrastando = false; enviarFader(true); });
  $("trilho").addEventListener("pointercancel", function () { arrastando = false; });
  setInterval(function () { if (fv !== 0) enviarFader(true); }, 1000); // o prompter para sozinho se o celular sumir
  function modo(m) {
    document.querySelectorAll("[data-modo]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-modo") === m)); });
    $("fader").hidden = m !== "fader"; $("auto").hidden = m === "fader";
    if (m !== "fader" && fv !== 0) { fv = 0; enviarFader(true); }
    try { localStorage.setItem("tp.controle.modo", m); } catch (e) {}
    if (m === "fader") requestAnimationFrame(desenharFader);
  }
  document.querySelectorAll("[data-modo]").forEach(function (b) { b.addEventListener("click", function () { modo(b.getAttribute("data-modo")); }); });
  window.addEventListener("resize", desenharFader);
  modo(pegar("tp.controle.modo") === "fader" ? "fader" : "auto");
  if (q && limpar(q).length === 4) entrar(limpar(q));
})();
</script>
</body>
</html>
