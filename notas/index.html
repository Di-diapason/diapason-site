<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="color-scheme" content="light dark">
<title>Notas · Diapason</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:'Montserrat';font-weight:400 800;font-display:swap;src:url(/fonts/montserrat-normal-400-800-latin.woff2) format('woff2')}
@font-face{font-family:'Lato';font-weight:400;font-display:swap;src:url(/fonts/lato-normal-400-latin.woff2) format('woff2')}
@font-face{font-family:'Lato';font-weight:400;font-display:swap;src:url(/fonts/lato-normal-400-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+1E00-1EFF}
:root{--fundo:#F2F0E6;--texto:#0F3633;--suave:rgba(15,54,51,.68);--linha:rgba(15,54,51,.2);--caixa:#fbfaf5;--acento:#E25A26}
@media (prefers-color-scheme:dark){:root{--fundo:#0F3633;--texto:#F2F0E6;--suave:rgba(242,240,230,.7);--linha:rgba(242,240,230,.22);--caixa:#0b2b28}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fundo);color:var(--texto);font:400 17px/1.55 Lato,system-ui,sans-serif;height:100vh;height:100dvh;display:flex;flex-direction:column;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.topo{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:18px 16px 8px;max-width:1100px;width:100%;margin:0 auto}
h1{font:800 20px/1.2 Montserrat,system-ui,sans-serif;margin:0;letter-spacing:-.01em;overflow-wrap:anywhere}
h1 a{color:inherit;text-decoration:none}
h1 span{font-weight:400;color:var(--suave)}
.topo nav a{color:var(--suave);font-size:14px;text-decoration:none;white-space:nowrap}
main{flex:1;min-height:0;display:flex;flex-direction:column;max-width:1100px;width:100%;margin:0 auto;padding:0 16px calc(18px + env(safe-area-inset-bottom));overflow-y:auto}
.aviso{font-size:14px;color:var(--suave);margin:0 0 10px;display:flex;flex-wrap:wrap;gap:4px 14px}
.aviso b{font-weight:400;color:var(--texto)}
textarea{flex:1 1 auto;min-height:140px;width:100%;resize:none;font:400 17px/1.6 Lato,system-ui,sans-serif;color:var(--texto);background:var(--caixa);border:1px solid var(--linha);border-radius:12px;padding:16px}
textarea:focus{outline:2px solid var(--texto);outline-offset:1px}
.barra{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px;padding-bottom:2px;flex:none}
button{font:inherit;font-size:15px;padding:9px 16px;border-radius:9px;border:1px solid var(--linha);background:transparent;color:var(--texto);cursor:pointer}
button:hover{border-color:var(--texto)}
.estado{margin-left:auto;font-size:14px;color:var(--suave)}
.estado i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--suave);margin-right:6px;vertical-align:1px}
.estado.ok i{background:var(--acento)}
.conflito{display:none;flex:none;margin:0 0 10px;padding:12px 14px;border:1px solid var(--texto);border-radius:10px;font-size:15px}
.conflito.ver{display:block}
.conflito button{margin:8px 8px 0 0}
.abrir{max-width:520px}
.abrir p{color:var(--suave);margin:0 0 18px}
.abrir form{display:flex;gap:8px}
.abrir input{flex:1;min-width:0;font:inherit;font-size:18px;padding:11px 13px;border:1px solid var(--linha);border-radius:10px;background:var(--caixa);color:inherit}
.abrir h2{font:400 15px/1.3 Lato,system-ui,sans-serif;color:var(--suave);margin:28px 0 8px}
.abrir ul{list-style:none;margin:0;padding:0}
.abrir li a{display:block;padding:10px 0;border-bottom:1px solid var(--linha);color:var(--texto);text-decoration:none}
.abrir li small{color:var(--suave);margin-left:8px}
@media (min-width:768px){
  body{font-size:19px}
  .topo{padding:28px 32px 12px}
  h1{font-size:26px}
  .topo nav a{font-size:16px}
  main{padding:0 32px calc(28px + env(safe-area-inset-bottom))}
  .aviso{font-size:16px;margin-bottom:14px}
  textarea{font-size:20px;line-height:1.65;padding:22px 24px}
  button{font-size:17px;padding:11px 20px}
  .estado{font-size:16px}
  .conflito{font-size:17px}
  .abrir{max-width:680px;margin:6vh auto 0;width:100%}
  .abrir p{font-size:20px}
  .abrir input{font-size:22px;padding:14px 16px}
  .abrir h2{font-size:17px;margin-top:40px}
  .abrir li a{font-size:20px;padding:14px 0}
  .abrir li small{font-size:16px}
}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="topo">
  <h1><a href="/notas/">Notas</a> <span id="titulo-nome"></span></h1>
  <nav><a href="/notas/_sair">Sair</a></nav>
</header>
<main>
  <section class="abrir" id="tela-abrir" hidden>
    <p>Digite um nome para abrir ou criar uma nota. Quem tiver o mesmo nome vê o mesmo texto.</p>
    <form id="form-abrir">
      <input id="campo-nome" placeholder="nome-da-nota" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Nome da nota">
      <button type="submit">Abrir</button>
    </form>
    <h2 id="titulo-recentes" hidden>Recentes neste aparelho</h2>
    <ul id="recentes"></ul>
  </section>

  <section id="tela-nota" hidden style="display:flex;flex-direction:column;flex:1;min-height:0">
    <p class="aviso"><span>Esta nota apaga sozinha 15 dias depois da última edição.</span><span id="ultima">Ainda não editada.</span></p>
    <div class="conflito" id="conflito" role="alert">
      <span id="conflito-msg">Outra pessoa editou esta nota ao mesmo tempo que você.</span><br>
      <button id="usar-deles" type="button">Ver a versão nova</button><button id="manter-minha" type="button">Manter a minha</button>
    </div>
    <textarea id="texto" spellcheck="true" aria-label="Texto da nota" placeholder="Escreva aqui. Salva sozinho."></textarea>
    <div class="barra">
      <button id="copiar" type="button">Copiar tudo</button>
      <button id="limpar" type="button">Limpar</button>
      <span class="estado" id="estado"><i></i><span>Carregando…</span></span>
    </div>
  </section>
</main>
<script>
(function () {
  "use strict";
  var LIMITE = 200 * 1024;
  var $ = function (id) { return document.getElementById(id); };
  function guardar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function pegar(k, padrao) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : padrao; } catch (e) { return padrao; } }
  function normalizar(s) {
    return (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
      .replace(/[^a-z0-9_-]+/g, "-").replace(/-+/g, "-").replace(/^-|-$/g, "").slice(0, 60);
  }
  function quando(ms) {
    if (!ms) return "";
    var d = new Date(ms), hoje = new Date();
    var h = d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    if (d.toDateString() === hoje.toDateString()) return "hoje às " + h;
    return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) + " às " + h;
  }

  var partes = location.pathname.replace(/\/+$/, "").split("/");
  var nome = partes.length > 2 ? normalizar(decodeURIComponent(partes[2])) : "";

  if (!nome) {
    $("tela-abrir").hidden = false;
    $("form-abrir").addEventListener("submit", function (e) {
      e.preventDefault();
      var n = normalizar($("campo-nome").value);
      if (n) location.href = "/notas/" + n;
    });
    var rec = pegar("notas.recentes", []);
    if (rec.length) {
      $("titulo-recentes").hidden = false;
      rec.forEach(function (r) {
        var li = document.createElement("li"), a = document.createElement("a");
        a.href = "/notas/" + r.nome; a.textContent = r.nome;
        var s = document.createElement("small"); s.textContent = quando(r.quando);
        a.appendChild(s); li.appendChild(a); $("recentes").appendChild(li);
      });
    }
    $("campo-nome").focus();
    return;
  }

  document.title = nome + " · Notas · Diapason";
  $("titulo-nome").textContent = "/ " + nome;
  $("tela-nota").hidden = false;
  var rec2 = pegar("notas.recentes", []).filter(function (r) { return r.nome !== nome; });
  rec2.unshift({ nome: nome, quando: Date.now() });
  guardar("notas.recentes", rec2.slice(0, 20));

  var caixa = $("texto");
  var api = "/api/notas/" + encodeURIComponent(nome);
  var aba = Math.random().toString(36).slice(2, 12), ultimaAba = null;
  var versao = 0, sincronizado = "", digitadoEm = 0, timer = null, gravando = false, pendente = false, emConflito = null;

  function estado(txt, ok) { var e = $("estado"); e.className = "estado" + (ok ? " ok" : ""); e.lastChild.textContent = txt; }
  function mostrarEditado(ms) { $("ultima").innerHTML = ms ? "Última edição: <b></b>." : "Ainda não editada."; if (ms) $("ultima").querySelector("b").textContent = quando(ms); }
  function sujo() { return caixa.value !== sincronizado; }
  function bytes(s) { return new Blob([s]).size; }

  function aplicarRemoto(n) {
    ultimaAba = n.aba || null;
    var ini = caixa.selectionStart, fim = caixa.selectionEnd, foco = document.activeElement === caixa;
    caixa.value = n.texto; sincronizado = n.texto; versao = n.versao; mostrarEditado(n.editado);
    if (foco) { try { caixa.setSelectionRange(Math.min(ini, n.texto.length), Math.min(fim, n.texto.length)); } catch (e) {} }
  }
  function abrirConflito(atual) {
    emConflito = atual; $("conflito").classList.add("ver"); estado("Conflito: escolha uma versão", false);
  }
  $("usar-deles").onclick = function () { if (emConflito) aplicarRemoto(emConflito); emConflito = null; $("conflito").classList.remove("ver"); estado("Salvo", true); };
  $("manter-minha").onclick = function () { if (emConflito) versao = emConflito.versao; emConflito = null; $("conflito").classList.remove("ver"); salvar(); };

  function carregar(primeira) {
    return fetch(api, { cache: "no-store", credentials: "same-origin" }).then(function (r) {
      if (r.status === 401) { location.reload(); throw new Error("senha"); }
      return r.json();
    }).then(function (n) {
      if (primeira) { aplicarRemoto(n); caixa.readOnly = false; estado(n.versao ? "Salvo" : "Nova nota", true); caixa.focus(); return; }
      if (emConflito) return;
      if (n.versao === versao) {
        // mesma versão gravada por outra aba ao mesmo tempo (o KV não trava): a minha perdeu
        if (n.aba && ultimaAba && n.aba !== ultimaAba && n.texto !== sincronizado) abrirConflito(n);
        return;
      }
      if (!sujo() && !gravando && Date.now() - digitadoEm > 1500) { aplicarRemoto(n); estado("Atualizado agora", true); }
      else if (n.versao > versao) abrirConflito(n);
    }).catch(function (e) { if (e.message !== "senha") estado("Sem conexão, tentando de novo", false); });
  }

  function salvar() {
    if (emConflito) return;
    if (gravando) { pendente = true; return; }
    var texto = caixa.value;
    if (bytes(texto) > LIMITE) { estado("Passou de 200 KB: não salvo", false); return; }
    gravando = true; estado("Salvando…", false);
    fetch(api, { method: "PUT", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ texto: texto, versaoBase: versao, aba: aba }) })
      .then(function (r) { return r.json().then(function (j) { return { s: r.status, j: j }; }); })
      .then(function (res) {
        gravando = false;
        if (res.s === 200) { versao = res.j.versao; ultimaAba = aba; sincronizado = texto; mostrarEditado(res.j.editado); estado("Salvo", true); if (pendente || sujo()) { pendente = false; agendar(); } }
        else if (res.s === 409) abrirConflito(res.j.atual);
        else if (res.s === 413) estado("Passou de 200 KB: não salvo", false);
        else if (res.s === 401) location.reload();
        else estado("Erro ao salvar", false);
      }).catch(function () { gravando = false; estado("Sem conexão: não salvo", false); setTimeout(agendar, 3000); });
  }
  function agendar() { clearTimeout(timer); timer = setTimeout(salvar, 1000); }

  caixa.addEventListener("input", function () { digitadoEm = Date.now(); estado("Digitando…", false); agendar(); });
  $("copiar").onclick = function () {
    var ok = function () { estado("Copiado", true); };
    if (navigator.clipboard) navigator.clipboard.writeText(caixa.value).then(ok, function () { caixa.select(); document.execCommand("copy"); ok(); });
    else { caixa.select(); document.execCommand("copy"); ok(); }
  };
  $("limpar").onclick = function () {
    if (!caixa.value || confirm("Apagar todo o texto desta nota? Não há histórico.")) { caixa.value = ""; digitadoEm = Date.now(); salvar(); caixa.focus(); }
  };
  window.addEventListener("beforeunload", function (e) { if (sujo()) { salvar(); e.preventDefault(); e.returnValue = ""; } });

  caixa.readOnly = true; // até a primeira leitura chegar, para não apagar o que a pessoa digitar
  (function primeira() { carregar(true).then(function () { if (caixa.readOnly) setTimeout(primeira, 2000); }); })();
  setInterval(function () { if (document.visibilityState === "visible") carregar(false); }, 3000);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") carregar(false); });
})();
</script>
</body>
</html>
